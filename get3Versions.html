<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3 Versions</title>
    <link rel="stylesheet" href="/flyoutmenu.css" />
    <link rel="stylesheet" href="/treeview.css" />
    <link rel="stylesheet" href="/get3versions.css" />
  </head>
  <body>
    <h1>3 Versions</h1>

    <div id="menu-container">Loading menu...</div>

    <div id="columns">
      <div>
        <h2>Tree View</h2>
        <div id="treeview-container">Loading...</div>
      </div>
      <div>
        <h2>Unordered List</h2>
        <div id="rawmenu-container">Loading...</div>
      </div>
    </div>

    <script>
      fetch('/getMenuData?_=' + Date.now())
        .then((res) => res.text())
        .then((html) => {
          document.getElementById('menu-container').innerHTML = html;
        })
        .catch((err) => {
          document.getElementById('menu-container').textContent =
            'Failed to load menu: ' + err.message;
        });

      fetch('/getTreeViewData?_=' + Date.now())
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById('treeview-container');
          container.innerHTML = html;
          container.querySelectorAll('#treeview li').forEach((li) => {
            if (li.querySelector(':scope > ul')) {
              li.classList.add('has-children');
              const link = li.querySelector(':scope > a');
              if (link) {
                link.classList.add('toggle');
                link.addEventListener('click', (e) => {
                  e.preventDefault();
                  li.classList.toggle('open');
                });
              }
            }
          });
        })
        .catch((err) => {
          document.getElementById('treeview-container').textContent =
            'Failed to load tree view: ' + err.message;
        });

      fetch('/getRawMenuData?_=' + Date.now())
        .then((res) => res.text())
        .then((html) => {
          document.getElementById('rawmenu-container').innerHTML = html;
        })
        .catch((err) => {
          document.getElementById('rawmenu-container').textContent =
            'Failed to load list: ' + err.message;
        });
    </script>
  </body>
</html>
