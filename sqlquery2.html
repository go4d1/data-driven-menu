<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: Arial, sans-serif;
    font-size: 13px;
    margin: 0;
    padding: 12px;
    background: #f4f6f8;
  }
  h3 {
    margin: 0 0 10px;
    color: #2c3e50;
    font-size: 16px;
  }

  #sql-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  #sql-input {
    width: 100%;
    height: 100px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    resize: vertical;
  }
  #sql-input:focus {
    outline: none;
    border-color: #1976d2;
    box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.15);
  }

  #btn-bar {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #btn-run {
    padding: 6px 20px;
    background: #1976d2;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
  }
  #btn-run:hover {
    background: #1256a0;
  }
  #btn-clear {
    padding: 6px 14px;
    background: #607d8b;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
  }
  #btn-clear:hover {
    background: #455a64;
  }
  #status {
    font-size: 12px;
    color: #888;
  }

  #results-wrap {
    overflow-x: auto;
  }
  #results-wrap table {
    border-collapse: collapse;
    width: 100%;
    background: white;
  }
  #results-wrap thead th {
    background: #2c3e50;
    color: white;
    padding: 6px 10px;
    border: 1px solid #1a252f;
    text-align: left;
    white-space: nowrap;
  }
  #results-wrap tbody td {
    padding: 4px 10px;
    border: 1px solid #ddd;
    white-space: pre-wrap;
    max-width: 400px;
    word-break: break-word;
  }
  #results-wrap tbody tr:nth-child(even) {
    background: #f5f7fa;
  }
  #results-wrap tbody tr:hover {
    background: #e3eaf8;
  }

  #error-msg {
    color: #c62828;
    background: #ffebee;
    border: 1px solid #ffcdd2;
    border-radius: 4px;
    padding: 8px 12px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    white-space: pre-wrap;
  }

  #history-wrap {
    margin-top: 16px;
  }
  #history-wrap summary {
    cursor: pointer;
    color: #555;
    font-size: 12px;
  }
  #history-list {
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .hist-item {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #1976d2;
    cursor: pointer;
    padding: 3px 6px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hist-item:hover {
    background: #e3eaf8;
  }
</style>

<h3>SQL Query</h3>

<div id="sql-wrap">
  <textarea
    id="sql-input"
    placeholder="SELECT * FROM fommenu WHERE ilevel > 30"
    spellcheck="false"
  ></textarea>
  <div id="btn-bar">
    <button id="btn-run">&#9654; Run</button>
    <button id="btn-clear">Clear</button>
    <span id="status"></span>
  </div>
</div>

<div id="results-wrap"></div>

<details id="history-wrap" style="display: none">
  <summary>History</summary>
  <div id="history-list"></div>
</details>
<script>
  // --- IGNORE ---  (function() {
  (function () {
    var history = [];

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function setStatus(msg, color) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.style.color = color || '#888';
    }

    function run() {
      var sql = document.getElementById('sql-input').value.trim();
      if (!sql) return;
      setStatus('Running…', '#888');
      document.getElementById('results-wrap').innerHTML = '';

      fetch('/runQuery', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sql: sql }),
      })
        .then(function (r) {
          return r.json();
        })
        .then(function (res) {
          if (res.error) {
            document.getElementById('results-wrap').innerHTML =
              '<div id="error-msg">' + esc(res.error) + '</div>';
            setStatus('Error', '#c62828');
            return;
          }
          addHistory(sql);
          var rowWord = res.rowCount === 1 ? 'row' : 'rows';
          if (!res.columns || res.columns.length === 0) {
            setStatus(
              res.rowCount + ' ' + rowWord + ' affected  (' + res.ms + ' ms)',
              '#2e7d32',
            );
            return;
          }
          setStatus(
            res.rows.length + ' ' + rowWord + '  (' + res.ms + ' ms)',
            '#2e7d32',
          );
          var html = '<table><thead><tr>';
          res.columns.forEach(function (c) {
            html += '<th>' + esc(c) + '</th>';
          });
          html += '</tr></thead><tbody>';
          res.rows.forEach(function (r) {
            html += '<tr>';
            res.columns.forEach(function (c) {
              var v = r[c];
              if (v !== null && typeof v === 'object') v = JSON.stringify(v);
              html += '<td>' + esc(v) + '</td>';
            });
            html += '</tr>';
          });
          html += '</tbody></table>';
          document.getElementById('results-wrap').innerHTML = html;
        })
        .catch(function (err) {
          setStatus('Request failed: ' + err.message, '#c62828');
        });
    }

    function addHistory(sql) {
      history = [sql]
        .concat(
          history.filter(function (s) {
            return s !== sql;
          }),
        )
        .slice(0, 20);
      var html = history
        .map(function (s) {
          return (
            '<div class="hist-item" title="' + esc(s) + '">' + esc(s) + '</div>'
          );
        })
        .join('');
      document.getElementById('history-list').innerHTML = html;
      document.getElementById('history-wrap').style.display = '';
    }

    document.getElementById('btn-run').addEventListener('click', run);

    document.getElementById('btn-clear').addEventListener('click', function () {
      document.getElementById('sql-input').value = '';
      document.getElementById('sql-input').focus();
      document.getElementById('results-wrap').innerHTML = '';
      setStatus('');
    });

    document
      .getElementById('sql-input')
      .addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
      });

    document
      .getElementById('history-list')
      .addEventListener('click', function (e) {
        var item = e.target.closest('.hist-item');
        if (item) {
          document.getElementById('sql-input').value =
            item.getAttribute('title');
          run();
        }
      });
  })();
</script>
